name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment

  deploy-firestore-rules:
    name: Deploy Firestore Rules
    runs-on: ubuntu-latest
    # Roda sempre que o arquivo de regras (ou este workflow) mudar no main.
    # O filtro de paths é avaliado pelo GitHub: o job só é enfileirado quando
    # pelo menos um dos arquivos listados foi alterado no push.
    if: |
      contains(github.event.commits.*.modified, 'firestore.rules') ||
      contains(github.event.commits.*.added,    'firestore.rules') ||
      contains(github.event.commits.*.modified, '.github/workflows/deploy.yml')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Autentica com a service account do Firebase (JSON armazenado como secret).
      # Para criar o secret: Firebase Console → Configurações do projeto →
      # Contas de serviço → Gerar nova chave privada → copie o JSON completo
      # e salve como secret FIREBASE_SERVICE_ACCOUNT no GitHub.
      #
      # A firebase-tools requer que GOOGLE_APPLICATION_CREDENTIALS aponte para
      # um arquivo em disco — não aceita o JSON inline. Escrevemos o conteúdo
      # do secret num arquivo temporário e apontamos a variável para ele.
      - name: Deploy Firestore security rules
        run: |
          echo "$SA_JSON" > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
            npx firebase-tools deploy --only firestore:rules --project "$PROJECT_ID"
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
