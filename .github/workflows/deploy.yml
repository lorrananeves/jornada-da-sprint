name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - uses: actions/deploy-pages@v4
        id: deployment

  deploy-firestore-rules:
    name: Deploy Firestore Rules
    runs-on: ubuntu-latest
    # Este job tem seu próprio trigger: roda apenas quando firestore.rules
    # ou este próprio workflow forem alterados no push para main.
    # Usa paths-filter (dorny/paths-filter) para detecção confiável —
    # a expressão `contains(github.event.commits.*.modified, ...)` não
    # funciona com arrays aninhados e sempre retorna false.
    steps:
      - uses: actions/checkout@v4

      - name: Detectar arquivos alterados
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rules:
              - 'firestore.rules'
              - '.github/workflows/deploy.yml'

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.rules == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.changes.outputs.rules == 'true'

      # Autentica via CI token gerado com `firebase login:ci`.
      # Para criar o secret:
      #   1. Na sua máquina: npx firebase-tools login:ci
      #   2. Copie o token exibido no terminal
      #   3. No GitHub: Settings → Secrets → Actions → New secret
      #      Nome: FIREBASE_TOKEN   Valor: <token copiado>
      - name: Deploy Firestore security rules
        if: steps.changes.outputs.rules == 'true'
        run: |
          npx firebase-tools deploy --only firestore:rules \
            --project "$PROJECT_ID" \
            --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
