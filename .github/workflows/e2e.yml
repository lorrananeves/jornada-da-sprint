name: E2E Tests

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E (Firestore Emulator)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Install Java (required by Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Firebase Emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase.json') }}

      - name: Start Firestore Emulator
        run: npx firebase emulators:start --only firestore --project demo-project &
        env:
          # Sem credenciais reais — o emulador não precisa delas
          FIREBASE_TOKEN: unused

      - name: Wait for emulator to be ready
        run: npx wait-on tcp:127.0.0.1:8080 --timeout 30000

      - name: Build app (emulator mode)
        run: npm run build
        env:
          VITE_FIREBASE_USE_EMULATOR: 'true'

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: 'true'
          VITE_FIREBASE_USE_EMULATOR: 'true'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
