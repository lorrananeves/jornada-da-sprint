name: E2E Tests

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E (Firestore Emulator)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Install Java (required by Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase Emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('firebase.json') }}

      - name: Build app (emulator mode)
        run: npm run build
        env:
          VITE_FIREBASE_USE_EMULATOR: 'true'

      # emulators:exec sobe o emulador, aguarda readiness, roda os testes e derruba.
      # Auth (9099) é necessário para o fluxo de login do Scrum Master nos testes E2E.
      - name: Run E2E tests (inside emulator)
        run: |
          npx firebase emulators:exec \
            --only firestore,auth \
            --project demo-project \
            "npm run test:e2e"
        env:
          CI: 'true'
          VITE_FIREBASE_USE_EMULATOR: 'true'
          FIREBASE_TOKEN: unused

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
